[package]
name = "codecrafters-shell"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2024"
rust-version = "1.96"

[dependencies]
anyhow = "1.0.68"
# we have some unused deps, but keeping this in case i need them later
bytes = "1.3.0"                                  # helps manage buffers
thiserror = "1.0.38"
regex = "1.13.1"

[dev-dependencies]
libc = "0.2.190"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
#nursery = { level = "warn", priority = -1 }
#nursery = "warn"
#cargo = "warn"

